# Mise à jour automatique des données, sans intervention :
# chaque matin, télécharge les derniers résultats F1, régénère les données, vérifie que tout passe
# (lint + build), puis recommite les données SEULEMENT si un Grand Prix a été couru.
# Ce commit déclenche Vercel, branché sur ce dépôt, qui reconstruit et publie le site (voir vercel.json).
#
# Lancement manuel : onglet Actions → « Mise à jour automatique » → Run workflow.

name: Mise à jour automatique

on:
  schedule:
    - cron: "0 6 * * *"        # tous les jours à 6 h UTC : un GP du dimanche (ou du samedi à Las Vegas) est en ligne le lendemain matin
  workflow_dispatch:

permissions:
  contents: write              # recommiter les données mises à jour

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # le tout premier passage télécharge tout OpenF1 (~15 min) ; ensuite quelques secondes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      # Cache OpenF1 (56 Mo, non versionné) conservé d'un passage à l'autre : seules les nouvelles courses sont téléchargées
      - uses: actions/cache@v4
        with:
          path: data/openf1
          key: openf1-${{ github.run_id }}
          restore-keys: openf1-

      - name: Données F1 (API Jolpica + OpenF1)
        run: |
          python scripts/fetch_api.py
          python scripts/fetch_openf1.py
          python scripts/donnees.py

      # Contrôles AVANT d'enregistrer : des données cassées ne doivent jamais arriver sur le site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build       # lance aussi « npm run verifier »

      - name: Enregistrer les nouvelles données (déclenche Vercel)
        run: |
          git config user.name "f1-atlas-bot"
          git config user.email "f1-atlas-bot@users.noreply.github.com"
          git add data/api src/donnees
          if git diff --cached --quiet; then
            echo "Aucune nouvelle course : rien à enregistrer, Vercel ne republie pas."
          else
            git commit -m "Résultats F1 au $(date -u +%F)"
            git push
          fi
